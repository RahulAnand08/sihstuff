<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Map</title>

		<link
			rel="stylesheet"
			href="https://unpkg.com/maplibre-gl@^6.4.1/dist/maplibre-gl.css"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="map.css" />
	</head>

	<body>
		<div id="map"></div>

		<img
			class="map-logo"
			src="https://i.ibb.co/F4XgGbdC/image.png"
			alt="HeritEDGE logo"
		/>

		<div id="arrow">
			<svg
				version="1.1"
				id="Icons"
				xmlns="http://www.w3.org/2000/svg"
				viewBox="0 0 32 32"
				xml:space="preserve"
			>
				<path
					d="m29.9 28.6-13-26c-.3-.7-1.4-.7-1.8 0l-13 26c-.2.4-.1.8.2 1.1.2.3.7.4 1.1.2L16 25.1 28.6 30c.1 0 .2.1.4.1.3 0 .5-.1.7-.3.3-.4.4-.9.2-1.2"
					fill="#00008b"
				/>
				<text x="16" y="17.5" font-size="4.2" class="logo-text">
					Herit
				</text>
				<text x="16" y="22.2" font-size="4.8" class="logo-text">
					EDGE
				</text>
			</svg>
		</div>

		<div id="navbar">
			<div id="moreinfocontent">
				<h2 class="data-name"></h2>
				<h3>Significance</h3>
				<p class="data-significance"></p>
				<h3>Key Features</h3>
				<ul class="data-keyfeatures">
					<li></li>
					<li></li>
				</ul>
				<!-- <h3>Student Life</h3> -->
				<!-- <p class="data-studentlife"></p> -->
				<h3>RAAHI Assistant</h3>
				<div class="input-button">
					<input
						type="text"
						id="ai-assistant-moreinfo"
						value="Ask away about the site!"
					/>
					<button id="ai-ask-button" type="button">Ask</button>
				</div>

				<p id="ai-response"></p>
			</div>

			<div id="navbar-main">
				<span id="nearestloc"> Nearest location </span>

				<span id="disttonearest"> 0 m </span>

				<span id="moreinfo">
					<?xml version="1.0" ?>
					<svg
						fill="#ffffff"
						width="25px"
						height="25px"
						viewBox="0 0 512 512"
						data-name="Layer 1"
						id="Layer_1"
						xmlns="http://www.w3.org/2000/svg"
					>
						<path
							d="M256,34,432,210l-21.2,21.21L271,91.4V478H241V91.4L101.16,231.25,80,210Z"
						/>
					</svg>
				</span>
			</div>
		</div>
		<div class="qr"><img src="qr.svg" alt="QR Code for rewards" /></div>
		<div class="readercont">
			<div id="reader" style="border: 0px"></div>
		</div>
		<div class="recenter">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				width="100"
				height="100"
				viewBox="0 0 24 24"
				fill="#ffffff"
			>
				<path
					d="M11 23v-4.175L9.9 19.9l-1.4-1.4L12 15l3.5 3.5l-1.4 1.4l-1.1-1.075V23zm-5.5-7.5l-1.4-1.4L5.175 13H1v-2h4.175L4.1 9.9l1.4-1.4L9 12zm13 0L15 12l3.5-3.5l1.4 1.4l-1.075 1.1H23v2h-4.175l1.075 1.1zm-6.5-2q-.625 0-1.062-.437T10.5 12t.438-1.062T12 10.5t1.063.438T13.5 12t-.437 1.063T12 13.5M12 9L8.5 5.5l1.4-1.4L11 5.175V1h2v4.175L14.1 4.1l1.4 1.4z"
				/>
			</svg>
		</div>

		<button id="points-button" type="button">
			Points: <span id="points-total">0</span>
		</button>
		<button id="marketplace-button" type="button">
			<a href="../marketplace/marketplace.html">Go to Marketplace</a>
		</button>
		<!-- <div id="points-popup" role="status" aria-live="polite">
            Points: <strong id="points-popup-total">0</strong>
        </div> -->
		<div id="points-award-notice" role="status" aria-live="polite">
			10 points added!
		</div>

		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script src="./map.js" type="module"></script>
		<script src="https://unpkg.com/html5-qrcode"></script>
	</body>
</html>
