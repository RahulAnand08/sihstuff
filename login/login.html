<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>RAAHI Login</title>
		<link rel="stylesheet" type="" href="./login.css" />
	</head>

	<body>
		<img src="logo.png" alt="RAAHI" id="logo" />

		<form class="container" id="login-form">
			<h2 style="margin-bottom: 10px">Sign in</h2>

			<label for="prof" id="role">Role</label>

			<select id="prof">
				<option value="tourist">Tourist</option>
				<option value="seller">Seller</option>
			</select>

			<label for="emailfield">Email</label>

			<input type="email" id="emailfield" required />

			<label for="passfield">Password</label>

			<input type="password" id="passfield" required />
			<div class="signinup">
				<button type="button" id="signin">SIGN IN</button>
				<button type="button" id="signup">SIGN UP</button>
			</div>
			<div class="oauth">
				<button type="button" id="googleauth"><img src="google.svg" alt=""></button>
				<button type="button" id="gitauth"><img src="github.svg" alt=""></button>
			</div>
      <a href="forgotpass.html">Forgot Password</a>
			<p id="message"></p>
		</form>

		<!-- Supabase -->
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script type="module" src="login.js"></script>
	</body>
</html>
