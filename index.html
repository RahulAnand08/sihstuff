<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAAHI Auth Demo</title>
  </head>
  <body>
    <h2>Welcome to RAAHI</h2>

    <div>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button id="signUpBtn">Sign Up</button>
      <button id="signInBtn">Sign In</button>
    </div>

    <p id="status">Loading status...</p>

    <!-- Load Firebase using ES Modules via CDN -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      // Your actual Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyAw6n2iv66iLNr_ZD4JI4rbTBRFpiUuV9g",
        authDomain: "raahi-63fed.firebaseapp.com",
        projectId: "raahi-63fed",
        storageBucket: "raahi-63fed.firebasestorage.app",
        messagingSenderId: "227077567279",
        appId: "1:227077567279:web:b4d47e61bba859f89de7da",
      };

      // Initialize Firebase and Auth
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const statusText = document.getElementById("status");

      // Sign Up
      document.getElementById("signUpBtn").addEventListener("click", () => {
        createUserWithEmailAndPassword(
          auth,
          emailInput.value,
          passwordInput.value,
        )
          .then((userCredential) =>
            alert(`Registered: ${userCredential.user.email}`),
          )
          .catch((error) => alert(`Error: ${error.message}`));
      });

      // Sign In
      document.getElementById("signInBtn").addEventListener("click", () => {
        signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
          .then((userCredential) =>
            alert(`Signed in: ${userCredential.user.email}`),
          )
          .catch((error) => alert(`Error: ${error.message}`));
      });

      // Listen to Auth State changes
      onAuthStateChanged(auth, (user) => {
        if (user) {
          statusText.innerText = `Currently logged in as: ${user.email}`;
        } else {
          statusText.innerText = "No user logged in.";
        }
      });
    </script>
  </body>
</html>
